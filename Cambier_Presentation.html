<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keeping LLMs Current · Alexandre Benjamin Cambier</title>
<style>
/* Keeping LLMs Current. One warm, minimal canvas: 21 slides, each a few steps. → or a click moves on; blocks with the
   ⤢ mark open into a larger view (with → when it is part of the talk, or with a click) and close with Esc, ← or a
   click outside. O: all slides · P: presenter window · N: speech · T: reset timer · B: black screen · F: full screen. */
:root{
  --bg:#F6F7FB;--card:#FFFFFF;--ink:#0B1124;--ink2:#444D66;--ink3:#5D6680;--mute:#97A0B6;--line:#E2E5EF;--hair:#ECEEF5;--soft:#F1F3F9;
  --amb:#13B5A4;--amb2:#9DEDE1;--amb3:#0B9285;--ambt:#087A70;--ambbg:#E8FAF6;
  --ter:#6A5AF5;--ter2:#B7AEFD;--ter3:#4031C9;--tert:#5546E3;--terbg:#EFEDFF;
  --grey:#C8CEDC;--hl:rgba(19,181,164,.24);--bad:#E5486B;--badbg:#FDEEF2;--r:28px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --glide:cubic-bezier(.7,0,.2,1);--out:cubic-bezier(.16,1,.3,1);
  --sh:0 1px 2px rgba(11,17,36,.035),0 22px 44px -26px rgba(64,49,201,.26);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{-webkit-user-select:none;user-select:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;overflow:hidden;background:radial-gradient(1300px 820px at 104% -8%,rgba(106,90,245,.075),transparent 62%),radial-gradient(1100px 760px at -6% 108%,rgba(19,181,164,.07),transparent 60%),var(--bg)}
#rail{position:absolute;right:60px;top:30px;display:flex;gap:30px;font:620 15px var(--font);color:var(--ink3);z-index:30}
#rail span{position:relative;padding-bottom:8px;transition:color .5s}
#rail span::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:1px;background:var(--ter);transform:scaleX(0);transform-origin:left;transition:transform .7s var(--out)}
#rail span.on{color:var(--ink)} #rail span.on::after{transform:none} #rail span.done{color:var(--ink2)}
#prog{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--amb),var(--ter));transition:width .9s var(--glide);z-index:30}
#dots{position:absolute;right:60px;bottom:22px;display:flex;gap:8px;z-index:30}
#dots i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .4s,transform .4s} #dots i.on{background:var(--ter);transform:scale(1.25)}
html.static #dots{display:none}

/* actors */
.a{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform,opacity;
  transition:transform 1s var(--glide),width 1s var(--glide),height 1s var(--glide),opacity .6s ease,box-shadow .5s}
.a.gone{visibility:hidden}
.fx{transition:opacity .16s ease}
.a.swap .fx,.a.swap > *{opacity:0;transition:opacity .14s ease}
.a.dim{pointer-events:none}
.play .in{animation:fu .95s var(--out) both;animation-delay:calc((var(--t,0s)) * var(--tempo,1))}
.play .pop{animation:pp .75s var(--out) both;animation-delay:calc((var(--t,0s)) * var(--tempo,1))}
.play .fade{animation:fd .8s ease both;animation-delay:calc((var(--t,0s)) * var(--tempo,1))}
.play .gx{animation:gx 1.2s var(--out) both;animation-delay:calc((var(--t,0s)) * var(--tempo,1))}
.play .gy{animation:gy 1s var(--out) both;animation-delay:calc((var(--t,0s)) * var(--tempo,1))}
.play .gyt{animation:gy .8s var(--out) both;animation-delay:calc((var(--t,0s)) * var(--tempo,1))}
.play .draw{animation:dw 1.4s var(--out) both;animation-delay:calc((var(--t,0s)) * var(--tempo,1))}
.play .wipe{animation:wp .9s var(--out) both;animation-delay:calc((var(--t,0s)) * var(--tempo,1))}
.play .ch{animation:fd .05s linear both;animation-delay:calc((var(--t,0s)) * var(--tempo,1))}
.gx{transform-origin:left center} .gy{transform-origin:center bottom} .gyt{transform-origin:center top}
.draw{stroke-dasharray:1}
@keyframes fu{from{opacity:0;transform:translateY(18px);filter:blur(5px)}}
@keyframes pp{from{opacity:0;transform:scale(.9);filter:blur(4px)}}
@keyframes fd{from{opacity:0}}
@keyframes gx{from{transform:scaleX(0)}}
@keyframes gy{from{transform:scaleY(0)}}
@keyframes dw{from{stroke-dashoffset:1}}
@keyframes wp{from{clip-path:inset(0 100% 0 0)}}
span.in,span.pop,.w{display:inline-block}
.ring{position:absolute;inset:-3px;border-radius:24px;box-shadow:0 0 0 3px var(--rc,var(--ter));opacity:0;pointer-events:none}
.play .ring{animation:ring 1.4s ease both;animation-delay:calc((var(--t,0s)) * var(--tempo,1))}
@keyframes ring{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
html.static .a,html.static .a *,html.static #prog,html.static #rail *{transition:none !important;animation:none !important}

/* blocks that open: a mark, a hover ring, a close pill */
.a.zz{cursor:zoom-in}
.a.zz:hover{box-shadow:var(--sh),0 0 0 3px var(--amb2)}
.zi{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;background:var(--terbg);display:grid;place-items:center;z-index:4;pointer-events:none;transition:transform .3s var(--out),background .3s}
.zi svg{width:15px;height:15px;fill:none;stroke:var(--ter);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.a.zz:hover .zi{transform:scale(1.15);background:var(--ter)} .a.zz:hover .zi svg{stroke:#fff}
.play .zi{animation:zip 1.4s ease-out 2 both;animation-delay:calc((var(--zt,2s)) * var(--tempo,1))}
@keyframes zip{0%{box-shadow:0 0 0 0 rgba(106,90,245,.38)}100%{box-shadow:0 0 0 14px rgba(106,90,245,0)}}
.zc{position:absolute;top:18px;right:18px;z-index:6;display:flex;align-items:center;gap:8px;font:700 15px var(--font);color:var(--ink2);background:var(--soft);border-radius:999px;padding:9px 14px;cursor:pointer}
.zc:hover{background:var(--line);color:var(--ink)}
html.static .zi,html.static .zc{display:none}

/* shared */
.card{background:var(--card);border-radius:var(--r);padding:30px 34px;box-shadow:var(--sh),inset 0 0 0 1px var(--line);overflow:hidden}
.card.zoomc{box-shadow:0 40px 90px -40px rgba(11,17,36,.35),inset 0 0 0 1px var(--line)}
.k{display:block;font:760 14px/1 var(--font);letter-spacing:.13em;text-transform:uppercase;color:var(--kc,var(--ink3));margin-bottom:16px}
.card h3{font:760 30px/1.18 var(--font);letter-spacing:-.022em}
.card h4{font:740 23px/1.2 var(--font);letter-spacing:-.012em}
:where(.card) p{font:450 22px/1.45 var(--font);color:var(--ink2);margin-top:10px}
:where(.card) p b{color:var(--ink);font-weight:680}
p,.cap2,.take span,.fd,.ds,.vl,.fn{text-wrap:pretty} h3,.hd h2{text-wrap:balance}
.big{font:800 60px/1 var(--font);letter-spacing:-.045em;color:var(--ink)}
.mono{font-family:var(--mono);letter-spacing:0}
.hd .kk{font:760 15px/1 var(--font);letter-spacing:.17em;text-transform:uppercase;color:var(--ter)}
.hd h2{font:780 52px/1.08 var(--font);letter-spacing:-.036em;margin-top:13px}
.sub{font:500 24px/1.3 var(--font);color:var(--ink2)}
.fn{font:500 19px/1.4 var(--font);color:var(--ink3)} .fn b{color:var(--ink2);font-weight:650}
.stat{display:flex;align-items:baseline;gap:16px;margin-top:18px} .stat > b{font:800 48px/1 var(--font);letter-spacing:-.04em;white-space:nowrap;color:var(--ink)} .stat > span{font:500 20px/1.3 var(--font);color:var(--ink2)}
.stat.col{flex-direction:column;gap:8px;align-items:flex-start} .stat.col > span{white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.take{display:flex;align-items:center;gap:16px;font:620 27px/1.3 var(--font);letter-spacing:-.01em;color:var(--ink)}
.take > i{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--ter);display:grid;place-items:center}
.take > i svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.take b{color:var(--tert);font-weight:740}
.dtg{display:inline-flex;align-items:center;font:740 12px/1 var(--font);letter-spacing:.13em;text-transform:uppercase;color:var(--ink2);padding:9px 13px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);background:var(--card);white-space:nowrap}
.upto{font:700 18px var(--font);font-style:normal;color:var(--ink2);letter-spacing:0;margin-right:6px}

/* title */
.t-kick{font:600 26px/1.3 var(--font);color:var(--ink2)}
.t-main{font:820 140px/1 var(--font);letter-spacing:-.056em}
.t-main .ac{background:linear-gradient(95deg,var(--amb) 0%,var(--ter) 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
.t-sub{font:600 52px/1.1 var(--font);letter-spacing:-.03em;color:var(--ink2)}
.t-meta{display:flex;gap:60px;font:500 26px/1.3 var(--font);color:var(--ink2)} .t-meta b{color:var(--ink);font-weight:700}
.logo img{height:56px;display:block}
.tline{display:flex;gap:28px} .tline div{position:relative;height:3px;border-radius:2px;background:var(--lc)}
.tline span{position:absolute;left:0;right:0;top:16px;text-align:center;font:680 17px/1.2 var(--font);color:var(--lt,var(--lc));white-space:nowrap}

/* question and chain */
.q{font:760 64px/1.15 var(--font);letter-spacing:-.035em;text-align:center}
.q b{color:var(--tert);font-weight:800}
.q.dock{font-size:27px;text-align:left;background:var(--card);border-radius:999px;padding:13px 26px;letter-spacing:-.01em;box-shadow:inset 0 0 0 1px var(--line)}
.q.mid{font-size:48px}
.node{height:90px;border-radius:45px;display:grid;place-items:center;font:760 34px/1 var(--font);letter-spacing:-.02em;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);color:var(--ink3);white-space:nowrap;overflow:hidden}
.node.known{background:var(--ink);color:#fff;box-shadow:none}
.node.fill{color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.node.ans{background:var(--ter);color:#fff;box-shadow:0 14px 30px -14px rgba(106,90,245,.7)}
.node.sm{height:72px;font-size:30px}
.play.node.shim .fx{animation:shm 1.2s ease both;animation-delay:calc((3.4s) * var(--tempo,1))} @keyframes shm{0%,100%{opacity:1}50%{opacity:.2}}
.arr .al,.arrv .al{position:absolute;background:#CDD3E0;border-radius:2px}
.arr .al{left:0;right:4px;top:calc(50% - 1.25px);height:2.5px} .arrv .al{top:0;bottom:4px;left:calc(50% - 1.25px);width:2.5px}
.arr .ah,.arrv .ah{position:absolute;width:13px;height:13px;border-top:2.5px solid #CDD3E0;border-right:2.5px solid #CDD3E0}
.arr .ah{right:2px;top:calc(50% - 6.5px);transform:rotate(45deg)} .arrv .ah{bottom:2px;left:calc(50% - 6.5px);transform:rotate(135deg)}
.play .ah{animation:fd .3s ease both;animation-delay:calc((var(--t2,0s)) * var(--tempo,1))}
.arr .lb{position:absolute;left:0;right:0;bottom:calc(50% + 14px);text-align:center;font:620 21px var(--font);color:var(--ink2);white-space:nowrap}
.arrv .lb{position:absolute;left:calc(50% + 18px);top:50%;transform:translateY(-50%);font:620 19px var(--font);color:var(--ink3);white-space:nowrap}

/* mini league table */
.mt div{display:grid;grid-template-columns:60px minmax(0,1fr) 70px;align-items:center;height:44px;padding:0 16px;border-radius:12px;font:540 22px/1 var(--font);color:var(--ink2)}
.mt div span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.mt .mh{height:28px;font:760 12px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)} .mt .mh span:last-child{font-weight:760;color:var(--ink3)}
.mt .above{box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink);font-weight:740}
.mt .self{background:var(--terbg);color:var(--tert);font-weight:740} .mt .self span:last-child{color:var(--tert)}

/* timeline */
.tlm{position:relative;height:150px;margin-top:6px}
.tlm .b{position:absolute;height:40px;border-radius:10px;display:flex;align-items:center;padding:0 14px;font:680 17px var(--font);white-space:nowrap;overflow:hidden}
.tlm .b1{top:6px;background:var(--soft);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line)} .tlm .b2{top:56px;background:var(--terbg);color:var(--tert)}
.tlm .cut{position:absolute;top:0;height:108px;border-left:2px dashed var(--ink)}
.tlm .ax{position:absolute;left:0;right:0;top:110px;height:2px;background:var(--line)}
.tlm .tk{position:absolute;top:122px;font:600 15px var(--font);color:var(--ink3);transform:translateX(-50%);white-space:nowrap}
.tlm .tk.l{transform:none} .tlm .tk.r{transform:translateX(-100%)}
.tlm .pin{position:absolute;top:10px;transform:translateX(-50%);font:700 13px/1 var(--font);color:#fff;background:var(--ter);padding:6px 9px;border-radius:7px;white-space:nowrap}

/* next token */
.card .sent{font:740 54px/1.15 var(--font);letter-spacing:-.034em;margin:18px 0 24px;color:var(--ink)}
.sent u{text-decoration:none;display:inline-block;position:relative;min-width:150px;border-bottom:4px solid var(--ter);color:var(--tert);text-align:center}
.sent .q1{position:absolute;left:0;right:0;opacity:0} .play .sent .q1{animation:q1 2.9s linear both}
@keyframes q1{0%,85%{opacity:1}100%{opacity:0}}
.pb{display:grid;grid-template-columns:170px minmax(0,1fr) 96px;gap:18px;align-items:center;margin-top:20px;font:620 27px var(--font)}
.pb span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:740}
.pb .tr{height:32px;border-radius:16px;background:var(--soft);overflow:hidden}
.pb .tr i{display:block;height:100%;width:var(--w);border-radius:16px;background:linear-gradient(90deg,var(--amb),var(--ter))}
.pb.dim .tr i{background:#E2E5EF} .pb.dim{color:var(--ink3)}
.pbn{margin-top:28px;padding-top:22px;border-top:1px solid var(--hair);font:500 24px/1.45 var(--font);color:var(--ink2)} .pbn b{color:var(--ink)}

/* boxes */
.box{border-radius:26px;background:var(--card);box-shadow:var(--sh),inset 0 0 0 1px var(--line);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px;padding:0 16px}
.box b{font:740 25px/1.12 var(--font);letter-spacing:-.014em}
.box small{font:500 18px/1.28 var(--font);color:var(--ink2)}
.box .ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:color-mix(in oklab,var(--ic) 13%,#fff);margin-bottom:8px}
.box .ic svg{width:27px;height:27px;fill:none;stroke:var(--ic);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.box .st{position:absolute;top:12px;left:16px;font:740 13px/1 var(--font);color:var(--ink3)}
.box:not(.row){justify-content:flex-start;padding-top:36px}
.box.row{flex-direction:row;justify-content:flex-start;text-align:left;gap:14px;padding:0 18px}
.box.row .ic{margin:0;flex:0 0 auto;width:46px;height:46px} .box.row b{display:block;font-size:21px} .box.row small{display:block;font-size:15px;margin-top:2px}
.box.row .st{top:10px;right:12px;left:auto}
.box.on{box-shadow:var(--sh),inset 0 0 0 2.5px var(--amb)}
.box .utag{font:760 11px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--tert);box-shadow:inset 0 0 0 1.5px var(--ter);border-radius:6px;padding:5px 7px;margin-top:8px}
.dotr{position:absolute;top:50%;left:0;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:var(--ter);box-shadow:0 0 0 6px rgba(106,90,245,.18);opacity:0}
.play .dotr{animation:trav 2.8s var(--glide) both;animation-delay:calc((var(--t,1.8s)) * var(--tempo,1))}
@keyframes trav{0%{opacity:0;transform:translateX(0)}6%{opacity:1}94%{opacity:1}100%{opacity:0;transform:translateX(var(--dx))}}
.mem{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.mem > div{border-radius:20px;padding:20px 22px;background:var(--soft)}
.mem > div > b{display:block;font:740 24px/1.15 var(--font)} .mem > div > span{display:block;font:500 18px/1.4 var(--font);color:var(--ink2);margin-top:6px}
.mem > div > em{display:inline-block;font:760 12px/1 var(--font);font-style:normal;letter-spacing:.13em;text-transform:uppercase;padding:6px 9px;border-radius:7px;margin-top:12px;color:var(--mc);box-shadow:inset 0 0 0 1.5px var(--mc)}

/* BM25 and embeddings */
.ib .nb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:780 20px/1 var(--font);background:var(--ambbg);color:var(--ambt);margin-bottom:18px}
.ib h3{font-size:28px} .ib .ds{font:500 19px/1.45 var(--font);color:var(--ink2);margin-top:10px} .ib .ds b{color:var(--ink)}
.ib.cp{display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:18px;row-gap:6px;align-items:center;align-content:center;padding:22px 26px}
.ib.cp .nb{margin:0;grid-row:1/3;width:40px;height:40px;font-size:18px} .ib.cp h3{font-size:22px} .ib.cp .ds{font-size:16px;margin-top:4px}
.idf{display:grid;grid-template-columns:118px minmax(0,1fr) 86px;gap:14px;align-items:center;margin-top:14px;font:620 20px var(--font)}
.idf .tr{height:16px;border-radius:8px;background:var(--soft);overflow:hidden} .idf .tr i{display:block;height:100%;width:var(--w);border-radius:8px;background:var(--amb)}
.idf > span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:720;color:var(--ink2)}
.idf small{display:block;font:500 13px/1.1 var(--font);color:var(--ink3);margin-top:2px;white-space:nowrap}
.lnb{display:grid;grid-template-columns:150px minmax(0,1fr) 54px;gap:12px;align-items:center;margin-top:14px;font:600 18px var(--font);color:var(--ink2)}
.lnb .tr{height:16px;border-radius:8px;background:var(--soft);overflow:hidden} .lnb .tr i{display:block;height:100%;width:var(--w);border-radius:8px;background:var(--amb)} .lnb b{text-align:right;color:var(--ink)}
.ch svg{display:block;width:100%;height:auto;overflow:visible}
.tx{font:600 16px var(--font);fill:var(--ink3)} .tb{font:720 18px var(--font);fill:var(--ink)}
.vec{display:grid;grid-template-columns:repeat(24,1fr);gap:4px;margin-top:14px}
.vec i{height:30px;border-radius:5px}
.vl{font:600 18px/1.4 var(--font);color:var(--ink2);margin-top:8px} .vl b{color:var(--ink)}
.rdc{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px} .rdc > span{font:600 18px/1.35 var(--font);padding:9px 13px;border-radius:10px;background:var(--soft);color:var(--ink2)} .rdc b{color:var(--ink);font-weight:780} .rdc .hi{background:var(--terbg);color:var(--tert)} .rdc .hi b{color:var(--tert)}
.mc{border-radius:20px;background:var(--soft);padding:18px 22px} .mc + .mc{margin-top:12px} .mc h4{font:740 20px/1.2 var(--font)} .mc p{font:500 17px/1.45 var(--font) !important;color:var(--ink2);margin-top:6px !important} .mc p b{color:var(--ink)}
.rng{display:flex;align-items:center;gap:18px;margin-top:8px;font:640 17px var(--font);color:var(--ink2)}
.rng input{-webkit-appearance:none;appearance:none;flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--ter) var(--v,20%),var(--line) var(--v,20%));outline:none;cursor:pointer}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 5px var(--ter),0 6px 14px -6px rgba(106,90,245,.7)}
.rng output{font:800 26px var(--font);color:var(--ink);min-width:34px;text-align:right}
html.static .rng{display:none}

/* passages */
.doc{border-radius:24px;background:var(--card);box-shadow:var(--sh),inset 0 0 0 1px var(--line);display:grid;grid-template-columns:66px minmax(0,1fr) 170px;align-items:center;gap:18px;padding:0 22px}
.doc .id{font:800 23px/1 var(--font);text-align:center;background:var(--soft);border-radius:14px;padding:9px 0}
.doc.ans .id{background:var(--terbg);color:var(--tert)}

/* an AI answering: avatar, thinking dots, the reply typed out, the final answer */

@keyframes thk{0%{opacity:0}8%{opacity:1}92%{opacity:1}100%{opacity:0}}

.lc{position:relative} .lc .tcl{margin-top:8px} .lc .tcl:first-child{margin-top:0}

.rsl em{position:absolute;right:8px;top:-9px;font:740 10px/1 var(--font);font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);background:var(--card);padding:2px 5px}
.rsl u{text-decoration:none}

.hn{font:600 14px/1 var(--font) !important;color:var(--tert) !important;margin:6px 0 0 42px !important}

.lmin .mc2{font:560 15px var(--mono);color:var(--ink2);width:420px} .secb{width:300px;height:10px;border-radius:5px;background:var(--soft);overflow:hidden} .secb i{display:block;height:100%;border-radius:5px;background:var(--ter2)}
.sv2{font:720 17px var(--font);width:70px} .lmin .fin{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font:760 17px/1 var(--font);padding:8px 12px;border-radius:10px;background:var(--terbg);color:var(--tert)} .lmin .fin i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--ter);color:#fff;font:800 11px/1 var(--font);font-style:normal}

.pb2 .tr{height:22px;border-radius:11px;background:var(--soft);overflow:hidden} .pb2 .tr i{display:block;height:100%;width:var(--w);border-radius:11px;background:linear-gradient(90deg,var(--amb),var(--ter))}

.lcon2 i{display:block;width:0;height:100%;margin:0 auto;border-left:2.5px dashed var(--amb)}

/* the library: a page, cut into passages */

/* BM25: the formula, its three parts */
.fml{display:flex;align-items:center;gap:14px;margin-top:4px;font:560 30px/1.2 var(--font);color:var(--ink)}
.fml .fl0{font-weight:700} .sig{font:400 46px/1 var(--font);display:inline-flex;align-items:flex-end;gap:2px} .sig sub{font:600 15px var(--font);color:var(--ink3);margin-bottom:-4px}
.fml .op{color:var(--ink3)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle} .frac .nu{padding:0 8px 6px} .frac .de{padding:6px 8px 0;border-top:2px solid var(--ink)}
.fp{position:relative;border-radius:12px;padding:6px 12px} .fp > i{position:absolute;top:-12px;right:-10px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:800 13px/1 var(--font);font-style:normal;color:#fff}

.play .fp{animation:hlp 1.3s ease both;animation-delay:calc((var(--t,0s)) * var(--tempo,1))} @keyframes hlp{0%,100%{transform:none}30%{transform:scale(1.06);box-shadow:inset 0 0 0 3px var(--ter),0 0 0 8px rgba(106,90,245,.14)}}
.flg{font:500 17px/1.4 var(--font) !important;color:var(--ink3) !important;margin-top:14px !important} .flg b{color:var(--ink2) !important}
.ib2{padding:26px 30px;display:flex;flex-direction:column} .ib2 > .fx{display:flex;flex-direction:column;height:100%}
.ib2 h3{font-size:27px;margin-top:14px} .ib2 .ds{margin-top:auto !important;padding-top:12px;font:500 18px/1.42 var(--font) !important;color:var(--ink2)} .ib2 .ds b{color:var(--ink)}

.tab.t1 i{background:var(--amb3)} .tab.t2 i{background:var(--ter)} .tab.t3 i{background:var(--ink2)}
.idf2{display:grid;grid-template-columns:minmax(0,1fr) 100px 54px;gap:14px;align-items:center;margin-top:30px;font:640 21px/1.2 var(--font)}
.idf2 small{display:block;font:500 16px var(--font);color:var(--ink3);margin-top:4px}
.idf2 .tr{height:14px;border-radius:7px;background:var(--soft);overflow:hidden} .idf2 .tr i{display:block;height:100%;width:var(--w);border-radius:7px;background:var(--amb)}
.idf2 > b{text-align:right;font:760 19px var(--font);color:var(--ink)}
.lenp{border-radius:14px;background:var(--soft);padding:12px 14px;margin-top:12px}
.lh2{display:flex;align-items:center;gap:10px} .lh2 b{font:800 17px var(--font)} .lh2 span{font:640 16px var(--font);color:var(--ink2)} .lh2 em{margin-left:auto;font:760 15px var(--font);font-style:normal;color:var(--ink)}
.card .lenp p{font:500 13.5px/1.45 var(--mono) !important;color:var(--ink2);margin-top:6px !important}
.lenp p u{text-decoration:none;background:var(--hl);border-radius:4px;color:var(--ink);font-weight:700}
.lbar{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:12px;align-items:center;margin-top:8px}
.lbar .tr{position:relative;height:12px;border-radius:6px;background:var(--card)} .lbar .tr i{display:block;height:100%;width:var(--w);border-radius:6px;background:var(--ink3)}
.lbar .tr s{position:absolute;top:-5px;bottom:-5px;border-left:2px dashed var(--ter)} .lbar b{font:760 16px var(--font);text-align:right}

/* BM25, word by word */
.q.dock u,.bmr u{text-decoration:none;box-shadow:inset 0 -6px 0 color-mix(in oklab,var(--tc) 45%,transparent);border-radius:3px}
.q.dock u{box-shadow:inset 0 -9px 0 color-mix(in oklab,var(--tc) 40%,transparent)}

.bseg small{align-self:center;font:600 16px var(--font);color:var(--ink3)}

.cfml .frac .nu,.cfml .frac .de{font-size:21px} .cfml small{flex-basis:100%;font:500 17px/1.4 var(--font);color:var(--ink2)} .cfml small b{color:var(--ink)}
.cres{display:grid;gap:8px;margin-top:4px} .cres > div{display:grid;grid-template-columns:minmax(0,1fr) 60px;column-gap:12px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--soft)}

/* advanced RAG: ranks, fusion, the two encoders */
.rkr{display:grid;grid-template-columns:44px 50px minmax(0,1fr) auto;align-items:center;gap:10px;height:54px;padding:0 16px;border-radius:12px;background:var(--soft);font:780 21px/1 var(--font)}
.rkr .rn{font:800 16px/1 var(--font);color:var(--ink3)} .rkr em{font:600 16px var(--font);font-style:normal;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .rkr small{font:600 16px var(--mono);color:var(--ink2)}

.rkr.ghost{background:transparent;border:1.5px dashed var(--mute);color:var(--ink3);grid-template-columns:44px 50px minmax(0,1fr)} .rkr.ghost em{white-space:normal;color:var(--ink3)}

.rrfr .did{font:800 21px var(--font)} .rrfr.d3 .did{color:var(--tert)}
.rp1{display:flex;flex-direction:column;gap:4px} .rp1 i{font:740 14px/1 var(--font);font-style:normal;color:#087A70} .rp1 i.m{color:var(--tert)} .rp1 i.no{color:var(--ink3);font-weight:600}
.rp1 em{font:600 17px var(--mono);font-style:normal;color:var(--ink)}

.rsum{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:12px;align-items:center} .rsum .tr{height:14px;border-radius:7px;background:var(--card);overflow:hidden} .rsum .tr i{display:block;height:100%;width:var(--w);border-radius:7px;background:var(--amb)}
.rsum b{font:800 20px var(--mono);text-align:right}
.rpur{font:540 19px/1.4 var(--font) !important;color:var(--ink2) !important;margin:0 0 10px !important} .rpur b{color:var(--ink)}
.enc2{border-radius:16px;background:var(--soft);padding:12px 16px 10px;margin-top:10px} .enc2 h5{font:760 14px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:#087A70} .enc2.x h5{color:var(--tert)}
.enc2 svg{display:block;width:100%;height:auto;margin-top:6px;overflow:visible} .card .enc2 p{font:500 16.5px/1.4 var(--font);color:var(--ink2);margin-top:4px} .enc2 p b{color:var(--ink)}

/* agents */
.pring{opacity:0} .play .pring{animation:pring 1s ease-out both;animation-delay:calc((var(--t,0s)) * var(--tempo,1))} @keyframes pring{0%{opacity:.75}100%{opacity:0;stroke-width:24px}}
.who{border-radius:18px;background:var(--soft);padding:20px 24px;margin-top:6px} .who + .who{margin-top:16px}

.wflow{display:flex;align-items:center;gap:10px;margin-top:12px} .wflow span{font:640 18px var(--font);padding:10px 14px;border-radius:11px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink2)} .wflow i{color:var(--ink3);font-style:normal}

.who .mono{font-size:17px;color:var(--ink);background:var(--card);padding:2px 6px;border-radius:6px}
.trw{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--hair);font:540 21px/1.4 var(--font);color:var(--ink)}
.trw:first-of-type{border-top:0} .trw > b{font:760 13px/1 var(--font);letter-spacing:.13em;text-transform:uppercase;padding:7px 9px;border-radius:8px;text-align:center}
.trw.k-think > b{background:var(--soft);color:var(--ink2)} .trw.k-act > b{background:var(--terbg);color:var(--tert)} .trw.k-observe > b{background:var(--ambbg);color:#087A70} .trw.k-ans > b,.trw.ans > b{background:var(--ter);color:#fff}
.trw .mono{font-size:17.5px} .trw em{font-style:normal;color:var(--tert);font-weight:700} .trw mark{background:var(--hl);border-radius:4px;font-weight:700}

.evd{display:grid;gap:8px;margin-top:6px} .evd span{font:540 19px var(--font);color:var(--ink2);padding:11px 14px;border-radius:12px;background:var(--soft)} .evd b{color:var(--tert);font-weight:780}

/* the seven systems, as a grid */
.mgrid{display:grid;grid-template-columns:250px 220px repeat(5,minmax(0,1fr)) 270px;gap:10px;align-items:center;height:100%}
.mhead .mcl{font:760 12.5px/1.25 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);text-align:center} .mhead .mcl:nth-child(2),.mhead .mcl:last-child{text-align:left}
.mrow{border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);padding:0 14px}
.mrow .ms{display:flex;align-items:center;gap:12px} .mrow .ms .sid{font:820 26px/1 var(--font);letter-spacing:-.03em;color:var(--g)} .mrow .ms .sn{font:620 17px var(--font);color:var(--ink2);white-space:nowrap}
.mrow .mcl{text-align:center;font:600 17px/1.25 var(--font);color:var(--ink)} .mrow .mcl.l{text-align:left;color:var(--ink2)} .mrow .mcl.w{text-align:left;color:var(--ink2);font-size:16px}

.msec .fx{display:flex;align-items:center;gap:12px;font:760 12.5px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--g)} .msec .fx::after{content:"";flex:1;height:1.5px;background:var(--g);opacity:.35}
.mleg .fx{display:flex;align-items:center;gap:18px;height:100%;flex-wrap:wrap;font:560 16px var(--font);color:var(--ink2)} .mleg b{font:760 13px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.mleg span{display:inline-flex;align-items:center;gap:8px}

/* the study */
.rq .rw2{font:540 19px/1.4 var(--font);color:var(--ink2);margin-top:16px;padding-left:14px;border-left:3px solid var(--ter2)}
.rule{display:flex;align-items:stretch;gap:10px;margin-top:6px}
.rule .rs{flex:1;border-radius:14px;background:var(--soft);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rule .rs small{font:740 12px/1.3 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)} .rule .rs .mono{font:560 18px/1.3 var(--mono);color:var(--ink)} .rule .rs mark{background:var(--hl);border-radius:4px;font-weight:700}
.rule .rs.ok{flex:0 0 220px;background:var(--terbg)} .rule .rs.ok b{font:780 22px/1 var(--font);color:var(--tert)} .rule .rs.ok em{font:600 15px var(--font);font-style:normal;color:var(--tert)}
.rule .ra{align-self:center;font:700 22px var(--font);color:var(--ink3);font-style:normal}
.rnum{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:12px;margin-top:16px} .rnum > span{font:500 18px/1.4 var(--font);color:var(--ink2);padding:12px 14px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)} .rnum b{color:var(--ink);font-weight:700}

/* practice */
.cell .chd > b{font:800 27px/1 var(--font);letter-spacing:-.015em} .cell .chd .av{width:52px;height:52px;font-size:16px}
.cell .chd .tgl{font-size:13px} .cell .bub2{font-size:19px !important;line-height:1.5}
.scring i{position:absolute;inset:0;border-radius:15px;box-shadow:0 0 0 3px var(--ter);opacity:0}
.play.scring i{animation:scr calc(var(--dur,2.6s) * var(--tempo,1)) ease both} @keyframes scr{0%{opacity:0;transform:scale(1.12)}12%{opacity:1;transform:none}50%{opacity:.45}85%{opacity:1}100%{opacity:0}}

/* judge.css · prefix jx- (study: judge.1–3, rule.1–8; v12 additions and the research questions in v12d.css, prefix pd-).
   Base styles are the FINAL state (?static and the way back); keyframes start from the first state. */

.jx-acc > em{font:640 22px/1 var(--mono);font-style:normal;padding:12px 16px;border-radius:999px;background:var(--soft);color:var(--ink)}

/* judge.1–3 · what counts as right: the question, the accepted answers (written in advance) */
.jx-case{padding:24px 40px}
.jx-cg{display:grid;grid-template-columns:minmax(0,1fr) 470px;height:100%}
.jx-cc{display:flex;flex-direction:column;justify-content:center;gap:11px;padding:0 36px;border-left:1.5px solid var(--hair)}

.jx-adv{display:block;font:560 17px/1.2 var(--font);color:var(--ink3)}

/* the answer: one object, which the judge gets (and the rule's column) */
.jx-sl{display:flex;align-items:flex-end}
.a.jx-src{display:flex;align-items:center;padding:0 18px;border-radius:16px;font:640 30px/1 var(--mono);color:var(--ink);white-space:nowrap;
  background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink),0 16px 28px -20px rgba(11,17,36,.5);
  transition:transform 1s var(--glide),width 1s var(--glide),height 1s var(--glide),opacity .6s ease,box-shadow .7s ease,background-color .8s ease,border-radius .9s var(--glide),padding .9s var(--glide)}

/* the judge: one lane, three columns (who, what it reads, its verdict) */
.jx-gr{padding:24px 32px;border-radius:var(--r)}
.jx-ln{display:grid;grid-template-columns:330px minmax(0,1fr) 268px;column-gap:26px;align-items:center;height:100%}
.jx-gh{display:grid;grid-template-columns:64px minmax(0,1fr);column-gap:18px;align-items:center}
.jx-gi{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--soft)}
.jx-gi svg{width:36px;height:36px;fill:none;stroke:var(--ink2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.jx-gh b{display:block;font:770 29px/1.15 var(--font);letter-spacing:-.02em;color:var(--ink)}
.jx-gh small{display:block;font:500 18px/1.35 var(--font);color:var(--ink2);margin-top:5px}
.jx-ev{display:flex;align-items:center;gap:12px}
.jx-tile{position:relative;font:640 20px/1 var(--mono);padding:12px 13px;border-radius:14px;background:var(--soft);color:var(--ink);white-space:nowrap}
/* exact match (why a judge): the words that make the answer longer than "19th" get a rose dashed outline */
.jx-xw{position:relative;z-index:0}
.jx-xw::before{content:"";position:absolute;z-index:-1;inset:-7px -6px -7px -6px;border-radius:10px;border:2px dashed var(--bad);background:color-mix(in oklab,var(--badbg) 70%,transparent)}
.play .jx-xw::before{animation:jxxw .6s var(--out) both;animation-delay:calc((var(--s,0s)) * var(--tempo,1))}
@keyframes jxxw{from{opacity:0;transform:scale(.92)}}
.jx-ne{width:40px;height:40px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font:700 26px/1 var(--font);font-style:normal;color:var(--bad);box-shadow:inset 0 0 0 2px color-mix(in oklab,var(--bad) 40%,#fff)}
.jx-vd{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:14px;height:100%;padding-left:28px;border-left:1.5px solid var(--hair)}
.jx-vd small{display:block;font:500 19px/1.35 var(--font);color:var(--ink2)} .jx-vd b{color:var(--ink);font-weight:740}
.jx-vp{align-items:center;gap:10px;flex:0 0 auto;font:780 25px/1 var(--font);padding:11px 22px 11px 11px;border-radius:999px;white-space:nowrap}
.jx-vp i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 17px/1 var(--font);font-style:normal}
.jx-vp.yes{background:#fff;color:var(--tert)} .jx-vp.yes i{background:linear-gradient(160deg,color-mix(in oklab,var(--ter) 75%,#fff),var(--ter));color:#fff}
.jx-vp.ok{background:var(--ambbg);color:var(--ambt)} .jx-vp.ok i{background:linear-gradient(160deg,var(--amb),var(--amb3));color:#fff}
/* the judge: a model, in the models' colour */
.jx-ai{border-radius:var(--r);overflow:hidden;color:#fff;background:linear-gradient(150deg,color-mix(in oklab,#6A5AF5 88%,#fff) 0%,#5546E3 55%,#2A2280 100%);box-shadow:0 24px 44px -22px rgba(106,90,245,.75)}
.jx-ai .jx-gi{background:rgba(255,255,255,.16)} .jx-ai .jx-gi svg{stroke:#fff}
.jx-ai .jx-gh b{color:#fff} .jx-ai .jx-gh small{color:rgba(255,255,255,.86)}
.jx-ai .jx-vd{border-left-color:rgba(255,255,255,.24)} .jx-ai .jx-vd small{color:rgba(255,255,255,.88)} .jx-ai .jx-vd b{color:#fff}
.jx-pr{display:block;font:500 20px/1.42 var(--font);color:#fff;padding:14px 20px 15px;border-radius:6px 20px 20px 20px;background:rgba(255,255,255,.14)}
.jx-pr small{display:block;font:560 16px/1.3 var(--font);color:rgba(255,255,255,.78);margin-bottom:6px}
.jx-vw{position:relative;display:inline-flex;min-width:122px}
.jx-vw .think{left:12px;top:50%;margin-top:-5px} .jx-ai .think i{background:rgba(255,255,255,.9)}

/* the writer is not the judge; every answer */
.jx-wr{padding:22px 36px}
.jx-wg{display:grid;grid-template-columns:330px 330px 44px 280px minmax(0,1fr);column-gap:24px;align-items:center;height:100%}
.jx-wt b{display:block;font:770 25px/1.2 var(--font);letter-spacing:-.015em;color:var(--ink)}
.jx-wt small{display:block;font:500 18px/1.35 var(--font);color:var(--ink2);margin-top:6px}
.jx-who{display:grid;grid-template-columns:56px minmax(0,1fr);column-gap:14px;align-items:center}
.jx-wi{width:56px;height:56px;border-radius:18px;display:grid;place-items:center}
.jx-wi svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.jx-wi.wr{background:linear-gradient(160deg,color-mix(in oklab,#B7AEFD 70%,#fff),#B7AEFD)} .jx-wi.jd{background:linear-gradient(150deg,#6A5AF5,#2A2280)}
.jx-who small{display:block;font:560 16px/1.2 var(--font);color:var(--ink3);white-space:nowrap}
.jx-who b{display:block;font:760 23px/1.2 var(--font);color:var(--ink);margin-top:4px}
.jx-neq{font:700 40px/1 var(--font);font-style:normal;color:var(--ink3);text-align:center}
.jx-cnt{display:flex;align-items:center;gap:18px;justify-self:end;padding-left:30px;border-left:1.5px solid var(--hair);height:100%}
.jx-cnt > b{font:800 46px/1 var(--font);letter-spacing:-.04em;color:var(--ink);font-variant-numeric:tabular-nums}
.jx-cnt > span{font:500 18px/1.35 var(--font);color:var(--ink2);white-space:nowrap}

/* rule.1–5 · the rule down one column: the card and a teal rail grow a row per click; each row is its own actor (the text after its stage) */
.jx-pl{padding:30px 32px}
.jx-pl .fx{display:flex;flex-direction:column;height:100%}
.a.jx-pl,.a.jx-rl{transition:transform 1s var(--glide),width .9s var(--out),height .9s var(--out),opacity .6s ease,box-shadow .5s}   /* grows fast, then the row arrives */
.jx-rw{display:grid;grid-template-columns:56px 320px 444px minmax(0,1fr);column-gap:18px;align-items:center}
.jx-sep{position:absolute;left:74px;right:0;top:0;border-top:1.5px solid var(--hair)}
.jx-rl{border-radius:2px;background:linear-gradient(var(--amb2),color-mix(in oklab,var(--amb2) 50%,#fff))}
.jx-n{width:44px;height:44px;margin-left:6px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,var(--amb),var(--amb3));color:#fff;font:800 20px/1 var(--font);font-style:normal;box-shadow:0 0 0 6px var(--card)}
.jx-r0 .av{width:52px;height:52px;margin-left:2px;font-size:16px}
.jx-rw > b{font:740 24px/1.2 var(--font);color:var(--ink);white-space:nowrap}
.jx-tx{position:relative;justify-self:start;display:inline-block;height:60px;line-height:60px;padding:0 18px;border-radius:16px;font-family:var(--mono);font-size:30px;font-weight:640;color:var(--ink);white-space:nowrap;overflow:hidden;
  background:var(--card);box-shadow:inset 0 0 0 2px var(--line)}
.jx-ph{visibility:hidden}
/* the text drops from the row above into its stage */
.play .jx-drop{animation:jxdrop .85s var(--out) both;animation-delay:calc((var(--t,0s)) * var(--tempo,1))}
@keyframes jxdrop{from{opacity:0;transform:translateY(-60px);filter:blur(3px)}}
.jx-nt{font:500 22px/1.3 var(--font);color:var(--ink2)} .jx-nt b{color:var(--ink);font-weight:720}
.jx-nt code{font:700 23px/1 var(--mono);color:var(--ambt);padding:3px 9px;border-radius:8px;background:var(--ambbg)}
.jx-ac{display:flex;flex-direction:column;gap:8px}
.jx-ac .jx-acc{gap:8px} .jx-ac .jx-acc > em{font-size:19px;padding:9px 12px;transition:background .6s ease,color .6s ease,box-shadow .6s ease}
/* rule.5: the accepted answer found lights up (a class, held by md until "19th" is marked in row 4) */
.jx-on .jx-acc > em:first-child{background:var(--ambbg);color:var(--ambt);box-shadow:inset 0 0 0 2.5px var(--amb3)}
.a.still .jx-acc > em{transition:none}
/* punctuation: turns teal, grows, then lifts away and the word closes up */
.jx-pu{display:inline-block;font-style:normal;max-width:0;opacity:0;vertical-align:bottom}
.play .jx-pu{animation:jxpu 1.3s var(--out) both;animation-delay:calc((var(--s,0s)) * var(--tempo,1))}
@keyframes jxpu{0%{max-width:.7em;opacity:1;color:var(--ink);transform:none}
  25%,45%{max-width:.7em;opacity:1;color:var(--amb3);transform:scale(1.4)}
  100%{max-width:0;opacity:0;color:var(--amb3);transform:translateY(-30px)}}
/* the accepted answer found inside; the extra words around it fade to grey: they do not matter */
.jx-hit{display:inline-block;font-style:normal;line-height:1.2;margin:-5px -6px;padding:5px 7px;border-radius:10px;background:var(--amb3);color:#fff}
.play .jx-hit{animation:jxhit .8s var(--out) both;animation-delay:calc((var(--s,0s)) * var(--tempo,1))}
@keyframes jxhit{0%{background:transparent;color:var(--ink);transform:none}30%{background:var(--amb3);color:#fff;transform:scale(1.14)}}
.jx-xg{color:var(--mute)}
.play .jx-xg{animation:jxxg .8s ease both;animation-delay:calc((var(--s,0s)) * var(--tempo,1))} @keyframes jxxg{from{color:var(--ink)}}
.jx-yn{display:flex;align-items:center;white-space:nowrap} .jx-yn b{color:var(--ink)}
.jx-okc{display:inline-grid;place-items:center;flex:0 0 auto;width:30px;height:30px;margin-right:10px;border-radius:50%;background:var(--amb3);color:#fff;font:800 15px/1 var(--font);font-style:normal}

/* rule.1 and rule.5 · the two verdicts */
.jx-vc{padding:28px 30px;border-radius:var(--r)}
.jx-vc .fx{display:flex;flex-direction:column;justify-content:space-between;height:100%}
.jx-vh{display:grid;grid-template-columns:60px minmax(0,1fr);column-gap:16px;align-items:center}
.jx-vh .jx-gi{width:60px;height:60px;border-radius:18px} .jx-vh .jx-gi svg{width:34px;height:34px}
.jx-gt{background:var(--ambbg)} .jx-gt svg{stroke:var(--amb3)}
.jx-vh small{display:block;font:740 15px/1.2 var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.jx-vh b{display:block;font:770 29px/1.15 var(--font);letter-spacing:-.018em;color:var(--ink);margin-top:6px}
.jx-ai .jx-vh small{color:rgba(255,255,255,.82)} .jx-ai .jx-vh b{color:#fff}
.jx-vb{display:flex;align-items:center;gap:16px;font:560 21px/1.3 var(--font);color:var(--ink2)}
.jx-ai .jx-vb{color:rgba(255,255,255,.92)}
.jx-ag{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;background:var(--ink);color:#fff;font:760 21px/1 var(--font);box-shadow:0 12px 26px -14px rgba(11,17,36,.8)}
.jx-ag i{font:800 26px/1 var(--font);font-style:normal;color:var(--amb2)}

/* rule.6 · the answer we followed (rule.1–5: a tile; rule.6: it shrinks into its own dot). The look sits on an inner span, so the morph is an animation
   that starts with the class jx-dotf, untouched by the engine's inline transition delay; static and the way back show the end at once */
.jx-sb{display:flex;align-items:center;width:100%;height:100%;padding:0 18px;border-radius:16px;font:640 30px/1 var(--mono);color:var(--ink);white-space:nowrap;overflow:hidden;
  background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink),0 16px 28px -20px rgba(11,17,36,.5)}
.jx-dotf .jx-sb{padding:0;border-radius:50%;font-size:0;color:transparent;background:color-mix(in oklab,#4031C9 46%,#fff);box-shadow:none}

@keyframes jxmorph{0%{padding:0 18px;border-radius:16px;font-size:30px;color:var(--ink);background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink),0 16px 28px -20px rgba(11,17,36,.5)}
  45%{color:var(--ink);background:#fff;box-shadow:inset 0 0 0 2.5px var(--ink),0 16px 28px -20px rgba(11,17,36,.5)}
  80%{color:transparent;background:var(--ter);box-shadow:none}
  100%{padding:0;border-radius:50%;font-size:0}}
/* the six where they differ: dark, with a ring that pulses once; then pulled out (an empty slot stays) */
.jx-dd{border-radius:50%;background:var(--ink);display:grid;place-items:center;box-shadow:0 0 0 2px var(--card),0 0 0 4px color-mix(in oklab,var(--ink) 35%,#fff);transition:transform 1s var(--glide),width 1s var(--glide),height 1s var(--glide),opacity .6s ease,background-color .6s ease,box-shadow .6s ease}
.jx-dr{position:absolute;inset:-7px;border-radius:50%;box-shadow:0 0 0 2.5px var(--ink);opacity:0}
.play .jx-dr{animation:jxdr 1.5s ease-out both;animation-delay:calc((var(--rp,.25s)) * var(--tempo,1))} @keyframes jxdr{0%{opacity:0;transform:scale(.6)}30%{opacity:1}100%{opacity:0;transform:scale(1.7)}}
.jx-dd b{font:800 19px/1 var(--font);color:#fff}
.jx-dd.jx-de{background:var(--bad);box-shadow:0 10px 18px -10px var(--bad)}
.jx-dd.jx-dq{background:var(--card);box-shadow:inset 0 0 0 2.5px var(--ink3)} .jx-dd.jx-dq b{color:var(--ink2)}
.jx-dh{border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--mute)}
/* results.css · the Results slides (rz-…, or-…) */
/* counters: the running count while playing; its final value in the static view and on the way back */
.rz-fin{display:none}
html.static .rz-fin{display:inline} html.static .rz-cnt{display:none}

/* which questions a chart counts: three pills of 40 (static grey, dynamic teal, multi-hop violet, as on the test slide), the counted ones lit */
.or-qs{display:flex;align-items:center;gap:8px;height:40px;white-space:nowrap}
.or-qs > i{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 15px;border-radius:999px;font:700 16px/1 var(--font);font-style:normal;color:var(--mute);background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}

/* charts: bands, bars, values, the axis of avatars, the dashed line of the bar to beat, the gap */
.rz-band{border-radius:28px;background:linear-gradient(180deg,color-mix(in oklab,var(--soft) 70%,#fff),var(--soft))}

.rz-ceill{text-align:right} .rz-ceill b{display:block;font:740 18px/1.2 var(--font);color:var(--ink);white-space:nowrap} .rz-ceill small{display:block;font:640 17px/1.3 var(--font);color:var(--ink3)}
.rz-ceill.l{text-align:left} .rz-ceill.l b{color:var(--ink2)}

.rz-gapl{text-align:right} .rz-gapl b{display:block;font:820 50px/1.08 var(--font);letter-spacing:-.035em;color:var(--tert);font-variant-numeric:tabular-nums}
.rz-gapl small{display:block;font:640 18px/1.3 var(--font);color:var(--ink2);margin-top:2px;white-space:nowrap}
.rz-rowl{text-align:right} .rz-rowl b{display:block;font:760 19px/1.1 var(--font);color:var(--ink)} .rz-rowl small{display:block;font:560 15px/1.25 var(--font);color:var(--ink3);margin-top:3px}

.rz-row b{font:780 23px/40px var(--font);color:var(--ink)} .rz-row b.hi{color:var(--tert)}

/* all.2b: each bar split in two, 1 Sep (a light tint with a soft outline) and 25 May (the bar itself, full colour); a dashed line at the mean, its value in a pill at the left end */
.or-mk{display:inline-block;width:14px;height:19px;border-radius:5px 5px 3px 3px;vertical-align:-3px;margin:0 7px 0 3px}

.or-lg .fx{display:block;height:34px;text-align:right;font:560 19px/34px var(--font);color:var(--ink2);white-space:nowrap}
.or-lg b{font-weight:700;color:var(--ink)}
.or-dr b{display:flex;align-items:center;justify-content:flex-end;height:40px;white-space:nowrap}
.or-dv span{font:760 22px/40px var(--font);color:var(--ink)}

/* cards beside a chart */
.card.rz-c{padding:26px 30px}
.rz-k{display:block;font:760 15px/1.25 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--kc,var(--ink3));margin-bottom:14px}

.rz-date{display:inline-flex;align-items:center;gap:12px;height:50px;padding:0 20px 0 16px;border-radius:999px;background:var(--card);box-shadow:var(--sh),inset 0 0 0 1.5px var(--line)}

.rz-tag .ok{background:var(--terbg);color:var(--tert)} .rz-tag .ok.a{background:var(--ambbg);color:var(--ambt)}
.rz-tag .ko{background:var(--badbg);color:var(--bad)}

.rz-tr{display:grid;grid-template-columns:118px 112px minmax(0,1fr);align-items:center;gap:14px;height:58px;padding:0 14px;border-radius:16px;background:var(--soft)}
.rz-tr em{font:760 18px/1.05 var(--font);font-style:normal;color:var(--ink)} .rz-tr em small{display:block;font:560 15px/1.2 var(--font);color:var(--ink3);margin-top:3px}
.rz-tr > b{font:820 36px/1 var(--font);text-align:right;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--ink)} .rz-tr > b small{font:640 16px var(--font);letter-spacing:0;color:var(--ink3);margin-left:5px}

/* RQ2: the headline gaps */
.rz-hl{display:grid;grid-template-columns:auto auto 1fr;align-items:center;column-gap:14px;margin-top:10px}

/* RQ2 · why searching once fails: one group per kind of multi-hop question, its chain, then S2 and S3 on one scale */
.or-grp{padding:14px 18px 16px;border-radius:20px;background:var(--soft)} .or-grp + .or-grp{margin-top:12px}
.or-gh{display:flex;align-items:baseline;justify-content:space-between;gap:12px} .or-gh b{font:760 20px/1.2 var(--font);letter-spacing:-.01em;color:var(--ink)}

.or-ch{display:flex;align-items:center;margin-top:10px}
.or-ch .or-pl{display:inline-block;height:36px;padding:0 15px;border-radius:999px;font:700 17px/36px var(--font);white-space:nowrap}
.or-pl.p1{background:var(--ink);color:#fff}
.or-pl.p2{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.or-pl.p3{background:linear-gradient(180deg,color-mix(in oklab,var(--ter) 80%,#fff),var(--ter));color:#fff;box-shadow:0 10px 20px -12px var(--ter)}
.or-hop{position:relative;display:inline-block;width:62px;height:36px;flex:0 0 auto}
.or-hop::before{content:"";position:absolute;left:3px;right:6px;top:16.75px;height:2.5px;border-radius:2px;background:var(--mute)}
.or-hop::after{content:"";position:absolute;right:5px;top:13px;width:8px;height:8px;border-top:2.5px solid var(--mute);border-right:2.5px solid var(--mute);transform:rotate(45deg)}
.or-hop b{position:absolute;left:15px;top:4px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line),0 4px 10px -6px rgba(11,17,36,.3)}
.or-hop svg{width:16px;height:16px;fill:none;stroke:var(--ink2);stroke-width:2.6;stroke-linecap:round}
.or-pbs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
.or-pb{display:flex;align-items:center;gap:12px}

.or-pb > span:not(.av){display:flex;align-items:center;gap:10px}

.or-pb b{font:800 26px/1 var(--font);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
/* RQ2 · what helps the agents: two columns, S4 and S2 out of 40 */
.or-c2{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.card .rz-h5{font:760 20px/1.2 var(--font);color:var(--ink);margin:0 0 4px} .rz-h5 small{display:block;font:560 16px/1.3 var(--font);color:var(--ink3);margin-top:4px}
.rz-mb{display:grid;grid-template-columns:38px minmax(0,1fr) 74px;gap:10px;align-items:center;margin-top:12px}

.rz-mb > i{display:block;height:16px;border-radius:999px;background:var(--soft);overflow:hidden} .rz-mb > i i{display:block;height:100%;width:var(--w);border-radius:999px;background:linear-gradient(90deg,color-mix(in oklab,var(--bc) 70%,#fff),var(--bc))}
.rz-mb > b{font:800 25px/1 var(--font);text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap} .rz-mb > b small{font:600 16px var(--font);color:var(--ink3)}

/* RQ3: one row per measure, S4 above S5, and the verdict */
.card.rz-h2h{padding:0 36px;display:flex;align-items:center}
.rz-h2h .fx{display:grid;grid-template-columns:250px minmax(0,1fr) 470px;column-gap:44px;align-items:center;width:100%}
.card.rz-h2h h4{font:780 30px/1.1 var(--font);letter-spacing:-.02em;color:var(--ink)} .rz-lb small{display:block;font:560 17px/1.3 var(--font);color:var(--ink3);margin-top:6px}
.rz-hr{display:grid;grid-template-columns:44px minmax(0,1fr) 140px;gap:16px;align-items:center} .rz-hr + .rz-hr{margin-top:12px}
.rz-hr .av{width:44px;height:44px;border-radius:14px;font-size:15px}
.rz-hr > i{display:block;height:22px;border-radius:999px;background:var(--soft);overflow:hidden} .rz-hr > i i{display:block;height:100%;width:var(--w);min-width:22px;border-radius:999px;background:linear-gradient(90deg,color-mix(in oklab,var(--bc) 70%,#fff),var(--bc))}
.rz-hr > b{font:800 32px/1 var(--font);text-align:right;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--ink)}
.rz-hv{padding-left:30px;border-left:2px solid var(--hair)}
.rz-hv b{display:block;font:800 30px/1.1 var(--font);letter-spacing:-.025em;color:var(--vc,var(--ink))} .rz-hv small{display:block;font:540 17px/1.38 var(--font);color:var(--ink2);margin-top:8px}
/* the bootstrap: rounder bins with a soft gradient */

.or-hist .br{border-radius:0 0 12px 12px}
/* synonyms: the pills readable, the wrong answers marked */
.or-pisa .tgl{font-size:15px;padding:9px 14px} .or-pisa .mwq{border-radius:20px} .or-pisa .mwp span{border-radius:999px;padding:10px 16px}

.or-pisa .mw{margin-top:30px} .or-pisa .mwp{margin-top:24px} .or-pisa .trf{margin-top:26px} .or-pisa .mwq{padding:24px 28px}
.or-pisa .trf > div{padding:18px 22px} .or-pisa .trf b{font-size:36px;color:var(--tert)} .or-pisa .trf span{font-size:18px}

/* ---------------- needs.1: a decision table, one row per need */

.kx-hd .fx > span:first-child{grid-column:1/3} .kx-hd .fx > span:last-child{padding-left:28px}

/* ---------------- limits.1: an icon on each card */
.lmc .kx-lh{display:flex;align-items:center;gap:14px}

/* ================================================================ v11a · Opening and Theory (title, question, moves, llm, rag, test, lib) */
/* shared motion: a line that draws with a dot riding its tip */
.OA_dw{stroke-dasharray:1}
.play .OA_dw{animation:OA_dw calc(var(--dur,.8s) * var(--tempo,1)) cubic-bezier(.45,0,.25,1) both;animation-delay:calc((var(--t,0s)) * var(--tempo,1))}
@keyframes OA_dw{0%{stroke-dashoffset:1;opacity:0}6%{opacity:1}100%{stroke-dashoffset:0}}
.OA_dot{position:absolute;left:0;top:0;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 36% 34%,#fff 0 16%,var(--ter) 34%);
  box-shadow:0 0 0 6px rgba(106,90,245,.16),0 6px 14px -4px rgba(106,90,245,.7);opacity:0;offset-rotate:0deg;offset-anchor:50% 50%;pointer-events:none}
.play .OA_dot{animation:OA_trv .8s cubic-bezier(.45,0,.25,1) both;animation-delay:calc((var(--t,0s)) * var(--tempo,1))}
@keyframes OA_trv{0%{offset-distance:0%;opacity:0}10%{opacity:1}86%{opacity:1}100%{offset-distance:100%;opacity:0}}

/* ---------------------------------------------------------------- moves: two date panels, two hops, two answers */
.OA_pan{padding:0 !important}
.OA_cal{position:absolute;left:34px;top:30px;width:70px;height:80px;border-radius:20px;background:#fff;overflow:hidden;text-align:center;
  box-shadow:inset 0 0 0 1.5px var(--line),0 12px 24px -16px rgba(64,49,201,.45)}

.OA_cal b{display:block;font:800 34px/52px var(--font);letter-spacing:-.03em;color:var(--ink)}
.OA_dt{position:absolute;left:126px;top:36px} .OA_dt b{display:block;font:780 31px/1.1 var(--font);letter-spacing:-.022em;color:var(--ink)}
.OA_dt span{display:block;font:560 19px/1.2 var(--font);color:var(--ink3);margin-top:8px}
.OA_tb{position:absolute;left:240px;top:134px;width:340px}
.OA_tb > div{display:grid;grid-template-columns:46px minmax(0,1fr) 46px;align-items:center;padding:0 14px}
.OA_tb .h{height:22px;font:760 15px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)} .OA_tb .h span:last-child{text-align:right}
.OA_tb .r{height:48px;margin-top:8px;border-radius:16px;font:540 22px/1 var(--font);color:var(--ink2)} .OA_tb .h + .r{margin-top:6px}
.OA_tb .r span:first-child{font-variant-numeric:tabular-nums;color:var(--ink3)}
.OA_tb .r span:nth-child(2){display:flex;align-items:center;gap:10px;white-space:nowrap}
.OA_tb .r span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:720;color:var(--ink)}

.OA_tb .r.above,.OA_tb .r.above span{color:var(--ink) !important;font-weight:760}
.OA_tb em{font:680 15px/1 var(--font);font-style:normal;color:var(--ink3);background:var(--soft);box-shadow:inset 0 0 0 1px var(--line);padding:6px 9px;border-radius:999px}
.OA_note{position:absolute;left:36px;top:398px;width:584px;font:500 17px/1.42 var(--font) !important;color:var(--ink3) !important;margin:0 !important}
/* the row overlays: Cremonese (violet) and the club above (a dark ring) */
.OA_cr,.OA_rg{transition:transform 1s var(--glide),width 1s var(--glide),height 1s var(--glide),opacity .6s ease,box-shadow .5s,background-color .6s,border-radius .6s}
.OA_cr{border-radius:16px;background:color-mix(in oklab,var(--ter) 10%,transparent);box-shadow:inset 0 0 0 2.5px var(--ter),0 10px 22px -14px rgba(106,90,245,.6)}
.OA_rg{border-radius:16px;box-shadow:inset 0 0 0 2px var(--line)}
.OA_rs{position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2.5px var(--ink)}
.play .OA_rs{animation:fd .35s ease both,OA_pls 1.1s ease-out both;animation-delay:calc((var(--t,0s)) * var(--tempo,1)),calc((var(--t,0s)) * var(--tempo,1))}
@keyframes OA_pls{0%{box-shadow:inset 0 0 0 2.5px var(--ink),0 0 0 0 rgba(106,90,245,.38)}100%{box-shadow:inset 0 0 0 2.5px var(--ink),0 0 0 18px rgba(106,90,245,0)}}
/* the hops */
.OA_hop{pointer-events:none}
.OA_hsv{position:absolute;left:0;top:0;width:820px;height:520px;overflow:visible}
.OA_hp,.OA_ah{fill:none;stroke:var(--ter);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.OA_hl{position:absolute;display:flex;align-items:center;gap:10px;font:720 19px/1 var(--font);color:var(--ink);white-space:nowrap}
.OA_hl i{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:800 15px/1 var(--font);font-style:normal}
/* the answer: a dashed slot, then the coach on a violet card */
.OA_ans{border-radius:26px;border:2px dashed var(--line);background:rgba(255,255,255,.55);transition:transform 1s var(--glide),width 1s var(--glide),height 1s var(--glide),opacity .6s ease,box-shadow .6s}
.OA_af{position:absolute;inset:-2px;border-radius:26px;background:linear-gradient(118deg,color-mix(in oklab,var(--ter) 70%,#fff) 0%,var(--ter) 55%,var(--ter3) 100%);box-shadow:0 24px 44px -24px rgba(106,90,245,.9)}
.OA_aq{position:absolute;inset:0;display:grid;place-items:center;font:780 42px/1 var(--font);color:var(--mute)}
.OA_ac{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:18px;color:#fff}
.OA_ac > i{flex:0 0 auto;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}
.OA_ac > i svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:2.1;stroke-linecap:round}
.OA_ac small{display:block;font:700 15px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.8)}

/* v13a · Practice (practice.js): real.1b–real.5 one board of four fixed columns, the library as 993 tiles; the marks Logged · Re-run · Inferred on every
   replayed run (chain.*, sept.*, real.*); the agents' rail aligned; official_tables, simpler */

/* ---- the three marks: Logged (solid ink), Re-run (dashed), Inferred (dotted violet); an icon and a word each */
.P13_mk{display:inline-flex;align-items:center;justify-content:center;gap:7px;flex:0 0 auto;width:124px;height:34px;border-radius:999px;font:780 15px/1 var(--font);

.P13_hd .fx{display:flex;align-items:center;gap:12px;height:100%;font:780 24px/1 var(--font);letter-spacing:-.01em;color:var(--ink);white-space:nowrap}

.P13_lib{position:relative;height:100%}

.play .P13_g i{animation:P13_tp .55s var(--out) both;animation-delay:calc((var(--t,0s)) * var(--tempo,1))} @keyframes P13_tp{from{opacity:0;transform:scale(.2)}}

  font:660 18px/1 var(--font);color:var(--ink);white-space:nowrap}

/* the sweep (every tile scored), the best 5 lit, the caption with its count */
.P13_band{position:absolute;overflow:hidden;border-radius:12px} .P13_band b{position:absolute;top:0;bottom:0;left:-150px;width:150px;opacity:0;

.play .P13_band b{animation:P13_bd 1.3s cubic-bezier(.45,0,.55,1) .1s both} @keyframes P13_bd{0%{opacity:1;transform:none}90%{opacity:1}100%{opacity:0;transform:translateX(730px)}}

  padding:7px 11px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--line)}

.bub2.pe-rp{font-size:22px;line-height:1.45;padding:20px 22px} .pe-rp .think{left:22px;top:28px}

.card.pe-ag .av{width:52px;height:52px;border-radius:17px;font-size:16px;flex:0 0 auto}
.P13_agw{display:flex;align-items:center;gap:16px;height:100%;padding:0 24px}

/* ---------------------------------------------------------------- Theory: how a language model writes (an example sentence: its weights, labels and

const AW = [['Mark', 110, 10, '#97A0B6'], ['took', 284, 24, '#13B5A4'], ['the', 432, 4, '#CDD3E0'], ['book', 586, 46, '#6A5AF5'], ['and', 748, 16, '#B455EE']];

const T14_X = i => PA_SX + (i < 5 ? AW[i][1] : BLX);                                                             /* a column's centre on the stage (5: the blank) */

const T14_ARCS = (t0, dt) => '<svg viewBox="0 0 ' + PA_SW + ' ' + LH + '" class="T14_svg">' + AW.map(([w, x, a, c], i) => { const h = 40 + (BLX - x) * .075, k = a / 46;
  return '<path class="draw" pathLength="1" style="--t:' + (t0 + i * dt).toFixed(2) + 's" d="M' + BLX + ',' + (WY - 60) + ' C' + BLX + ',' + (WY - 60 - h) + ' ' + x + ',' + (WY - 60 - h) + ' ' + x + ',' + (WY - 60) + '" fill="none" stroke="' + c + '" stroke-opacity="' + (.5 + k * .5).toFixed(2) + '" stroke-width="' + (2 + k * 10).toFixed(1) + '" stroke-linecap="round"/>'; }).join('') + '</svg>';

  '<rect class="pop" style="--t:.6s;transform-box:fill-box;transform-origin:center" x="' + (BLX - 105) + '" y="' + (WY - 58) + '" width="210" height="76" rx="22" fill="#EFEDFF" stroke="#6A5AF5" stroke-width="3" stroke-dasharray="9 7"/>' +

const V15_KY = 578, V15_KH = 50, V15_QX = T14_X(5) - 105, V15_QY = 566, V15_H = 572;

  return '<svg viewBox="0 0 900 100" class="V15_svg">' + [[1, '#13B5A4', 4, 70, .1], [3, '#6A5AF5', 6, 52, .35]].map(([i, c, sw, dy, t]) => { const x = T14_X(i) - V15_MX0;
    return '<path class="draw" pathLength="1" style="--t:' + t + 's" d="M' + sx + ',' + sy + ' C' + sx + ',' + (sy + dy) + ' ' + x + ',' + (sy + dy) + ' ' + x + ',' + ky + '" fill="none" stroke="' + c + '" stroke-width="' + sw + '" stroke-linecap="round"/>'; }).join('') + '</svg>'; };

/* slides, rail, progress, step dots */
